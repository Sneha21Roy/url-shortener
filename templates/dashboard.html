<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Shortener - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0e1117; --card: #171a21; --border: #2a2e38;
    --accent: #6d5efc; --text: #f2f2f5; --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    padding: 32px 24px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input {
    flex: 1; min-width: 160px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0e1117; color: var(--text);
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #2a2e38; }
  button:hover { opacity: 0.9; }
  a { color: #8ab4ff; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 500; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #232838; font-size: 0.8rem; }
  .hidden { display: none; }
  .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 6px; }
  .success { color: #5eead4; font-size: 0.85rem; margin-top: 6px; }
  #qrImg { max-width: 140px; border-radius: 8px; margin-top: 10px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div>
      <h1>🔗 URL Shortener</h1>
      <div class="subtitle">Shorten links, track clicks, and view analytics.</div>
    </div>
    <div id="authStatus" class="muted"></div>
  </div>

  <!-- AUTH CARD -->
  <div class="card" id="authCard">
    <div class="row" style="margin-bottom:10px;">
      <button id="showLogin">Login</button>
      <button id="showRegister" class="secondary">Register</button>
      <button id="logoutBtn" class="secondary hidden">Logout</button>
    </div>

    <div id="loginForm">
      <div class="row">
        <input id="loginEmail" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
      </div>
      <div id="loginMsg"></div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="row">
        <input id="regUsername" placeholder="Username">
        <input id="regEmail" placeholder="Email">
        <input id="regPassword" type="password" placeholder="Password (min 6 chars)">
        <button onclick="register()">Create account</button>
      </div>
      <div id="registerMsg"></div>
    </div>
    <div class="muted" style="margin-top:8px;">
      Logging in is optional — you can shorten links anonymously too, but you
      won't see them in "My URLs" or be able to view private analytics later.
    </div>
  </div>

  <!-- SHORTEN CARD -->
  <div class="card">
    <div class="row">
      <input id="originalUrl" placeholder="Paste a long URL, e.g. https://example.com/very/long/path">
      <input id="customAlias" placeholder="Custom alias (optional)" style="max-width:180px;">
      <button onclick="shorten()">Shorten</button>
    </div>
    <div id="shortenResult"></div>
  </div>

  <!-- MY URLS -->
  <div class="card">
    <div class="top-bar">
      <strong>My URLs</strong>
      <button class="secondary" onclick="loadUrls()">Refresh</button>
    </div>
    <table id="urlsTable">
      <thead>
        <tr><th>Short URL</th><th>Original</th><th>Clicks</th><th>Created</th><th></th></tr>
      </thead>
      <tbody id="urlsBody"></tbody>
    </table>
    <div id="urlsMsg" class="muted"></div>
  </div>

  <!-- ANALYTICS -->
  <div class="card">
    <strong>Analytics</strong>
    <div class="row" style="margin-top:10px;">
      <input id="analyticsCode" placeholder="Enter a short code, e.g. aZ3kP9">
      <button onclick="loadAnalytics()">View analytics</button>
      <button class="secondary" onclick="loadQr()">Get QR code</button>
    </div>
    <div id="analyticsSummary" class="muted" style="margin-top:10px;"></div>
    <canvas id="clicksChart" height="120"></canvas>
    <div id="referrerList"></div>
    <img id="qrImg" class="hidden">
  </div>

</div>

<script>
const BASE_URL = "{{ base_url }}";
let token = localStorage.getItem("token") || null;
let chart = null;

function authHeaders() {
  return token ? { "Authorization": "Bearer " + token } : {};
}

function setAuthUi() {
  const status = document.getElementById("authStatus");
  const logoutBtn = document.getElementById("logoutBtn");
  const authCardForms = ["loginForm", "registerForm"];
  if (token) {
    status.textContent = "Logged in";
    logoutBtn.classList.remove("hidden");
    authCardForms.forEach(id => document.getElementById(id).classList.add("hidden"));
  } else {
    status.textContent = "Not logged in (browsing anonymously)";
    logoutBtn.classList.add("hidden");
  }
}

document.getElementById("showLogin").onclick = () => {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("registerForm").classList.add("hidden");
};
document.getElementById("showRegister").onclick = () => {
  document.getElementById("registerForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");
};
document.getElementById("logoutBtn").onclick = () => {
  token = null;
  localStorage.removeItem("token");
  setAuthUi();
  loadUrls();
};

async function register() {
  const body = {
    username: document.getElementById("regUsername").value,
    email: document.getElementById("regEmail").value,
    password: document.getElementById("regPassword").value,
  };
  const res = await fetch("/api/auth/register", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const data = await res.json();
  const msg = document.getElementById("registerMsg");
  if (res.ok) {
    token = data.access_token;
    localStorage.setItem("token", token);
    msg.innerHTML = '<div class="success">Account created! You are now logged in.</div>';
    setAuthUi();
    loadUrls();
  } else {
    msg.innerHTML = `<div class="error">${data.error}</div>`;
  }
}

async function login() {
  const body = {
    email: document.getElementById("loginEmail").value,
    password: document.getElementById("loginPassword").value,
  };
  const res = await fetch("/api/auth/login", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const data = await res.json();
  const msg = document.getElementById("loginMsg");
  if (res.ok) {
    token = data.access_token;
    localStorage.setItem("token", token);
    msg.innerHTML = '<div class="success">Logged in!</div>';
    setAuthUi();
    loadUrls();
  } else {
    msg.innerHTML = `<div class="error">${data.error}</div>`;
  }
}

async function shorten() {
  const body = {
    original_url: document.getElementById("originalUrl").value,
    custom_alias: document.getElementById("customAlias").value || undefined,
  };
  const res = await fetch("/api/shorten", { method: "POST", headers: {"Content-Type":"application/json", ...authHeaders()}, body: JSON.stringify(body) });
  const data = await res.json();
  const result = document.getElementById("shortenResult");
  if (res.ok) {
    result.innerHTML = `<div class="success">Created: <a href="${data.short_url}" target="_blank">${data.short_url}</a></div>`;
    document.getElementById("originalUrl").value = "";
    document.getElementById("customAlias").value = "";
    loadUrls();
  } else {
    result.innerHTML = `<div class="error">${data.error}</div>`;
  }
}

async function loadUrls() {
  const body = document.getElementById("urlsBody");
  const msg = document.getElementById("urlsMsg");
  body.innerHTML = "";
  if (!token) {
    msg.textContent = "Log in to see your saved URLs and their click counts.";
    return;
  }
  const res = await fetch("/api/urls", { headers: authHeaders() });
  if (!res.ok) { msg.textContent = "Could not load URLs."; return; }
  const data = await res.json();
  if (data.urls.length === 0) {
    msg.textContent = "You haven't created any short URLs yet.";
    return;
  }
  msg.textContent = "";
  data.urls.forEach(u => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><a href="${u.short_url}" target="_blank">${u.short_code}</a></td>
      <td style="max-width:260px; overflow:hidden; text-overflow:ellipsis;">${u.original_url}</td>
      <td><span class="pill">${u.total_clicks}</span></td>
      <td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td><button class="secondary" onclick="deleteUrl('${u.short_code}')">Delete</button></td>
    `;
    body.appendChild(row);
  });
}

async function deleteUrl(code) {
  await fetch(`/api/urls/${code}`, { method: "DELETE", headers: authHeaders() });
  loadUrls();
}

async function loadAnalytics() {
  const code = document.getElementById("analyticsCode").value.trim();
  if (!code) return;
  const res = await fetch(`/api/analytics/${code}`, { headers: authHeaders() });
  const data = await res.json();
  const summary = document.getElementById("analyticsSummary");
  if (!res.ok) {
    summary.innerHTML = `<div class="error">${data.error}</div>`;
    return;
  }
  summary.innerHTML = `<strong>${data.total_clicks}</strong> total clicks on <code>${data.short_code}</code> &rarr; ${data.original_url}`;

  const labels = data.daily_clicks.map(d => d.date.slice(5));
  const values = data.daily_clicks.map(d => d.clicks);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("clicksChart"), {
    type: "line",
    data: { labels, datasets: [{ label: "Clicks", data: values, borderColor: "#6d5efc", backgroundColor: "rgba(109,94,252,0.15)", fill: true, tension: 0.3 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  const refList = document.getElementById("referrerList");
  if (data.top_referrers.length) {
    refList.innerHTML = "<div style='margin-top:10px;'><strong>Top referrers</strong><ul>" +
      data.top_referrers.map(r => `<li>${r.referrer} — ${r.count}</li>`).join("") + "</ul></div>";
  } else {
    refList.innerHTML = "";
  }
}

async function loadQr() {
  const code = document.getElementById("analyticsCode").value.trim();
  if (!code) return;
  const img = document.getElementById("qrImg");
  img.src = `/api/qr/${code}?t=${Date.now()}`;
  img.classList.remove("hidden");
}

setAuthUi();
loadUrls();
</script>
</body>
</html>
